<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>

  <!-- Fonts (already set up for you) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <!-- Tailwind (already set up for you) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // This lets you use the classes `font-sans` (Inter Tight) and `font-serif` (Instrument Serif)
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter Tight"', 'sans-serif'],
            serif: ['"Instrument Serif"', 'serif'],
          },
        },
      },
    };
  </script>
</head>

<body class="bg-stone-100 text-stone-900 font-sans">

  <!-- ===== HEADER ===== -->
  <header class="box-border px-5 pt-3 pb-5 border-b border-stone-900 sm:px-5 sm:pt-3 sm:pb-5">
   <div id="restaurant-info" class="grid grid-cols-1 gap-1 mb-4 text-xl font-semibold uppercase text-stone-500 sm:grid-cols-3 sm:gap-4 sm:text-lg"></div>
    <h1 id="restaurant-name" class="box-border w-full max-w-full whitespace-normal wrap-break-word text-5xl font-black uppercase sm:text-[86px] lg:text-[116px]"></h1>
    <p id="tagline" class="mt-3 text-2xl leading-none text-orange-700 font-serif italic sm:text-3xl"></p>
  </header>

  <!-- ===== CATEGORY NAV ===== -->
  <nav class="sticky top-0 z-20 h-16 bg-stone-100 border-b border-stone-900">
    <!-- One link per category goes in here (from the API) -->
    <ul id="category-nav" class="h-full flex items-center gap-2 px-5 overflow-x-auto"></ul>
  </nav>

  <!-- ===== MENU ===== -->
  <!-- One <section> per category goes in here (from the API) -->
  <main id="menu" class="px-5">
    <p id="status" class="py-10 text-center font-semibold">Loading the menu…</p>
    <section id="boot-up"></section>
    <section id="main-functions"></section>
    <section id="syntax"></section>
    <section id="fuel"></section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="min-h-28 px-5 py-5 bg-stone-900 text-stone-100">
    <p id="footer-name" class="mb-2 text-xl leading-none font-black uppercase"></p>
    <p id="footer-info" class="text-xs text-stone-300"></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
